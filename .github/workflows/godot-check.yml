name: Validate and build browser preview

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: behind-the-mask-pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate-and-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Arabic font for game export
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-core
          mkdir -p assets/fonts
          FONT_PATH="$(find /usr/share/fonts -type f -iname "*NotoSansArabic*Regular*.ttf" -print -quit)"
          if [ -z "$FONT_PATH" ]; then
            echo "Arabic font not found after installation"
            find /usr/share/fonts -iname "*Arabic*" | head -30
            exit 1
          fi
          cp "$FONT_PATH" assets/fonts/NotoSansArabic-Regular.ttf
          test -s assets/fonts/NotoSansArabic-Regular.ttf
      - name: Download Godot and export templates
        run: |
          set -euo pipefail
          wget -q https://github.com/godotengine/godot-builds/releases/download/4.4-stable/Godot_v4.4-stable_linux.x86_64.zip
          unzip -q Godot_v4.4-stable_linux.x86_64.zip
          chmod +x Godot_v4.4-stable_linux.x86_64
          wget -q https://github.com/godotengine/godot-builds/releases/download/4.4-stable/Godot_v4.4-stable_export_templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/4.4.stable"
          unzip -q Godot_v4.4-stable_export_templates.tpz -d godot_templates
          cp godot_templates/templates/* "$HOME/.local/share/godot/export_templates/4.4.stable/"
      - name: Import and check scripts
        run: |
          set -euo pipefail
          ./Godot_v4.4-stable_linux.x86_64 --headless --path . --editor --import --quit
          ./Godot_v4.4-stable_linux.x86_64 --headless --path . --quit-after 3
      - name: Test investigation routes and save recovery
        run: ./Godot_v4.4-stable_linux.x86_64 --headless --path . --script tests/test_campaign.gd
      - name: Export browser preview
        run: |
          set -euo pipefail
          VERSION="${GITHUB_SHA:0:8}"
          mkdir -p "build/web/versions/$VERSION"
          ./Godot_v4.4-stable_linux.x86_64 --headless --path . --export-release "Web" "build/web/versions/$VERSION/index.html"
          test -s "build/web/versions/$VERSION/index.html"
          cp "build/web/versions/$VERSION/"* build/web/
          printf '%s\n' "$GITHUB_SHA" > build/web/build-version.txt
      - uses: actions/upload-artifact@v4
        with:
          name: behind-the-mask-web-preview
          path: build/web/
          if-no-files-found: error

  publish-pages:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: validate-and-web
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: behind-the-mask-web-preview
          path: build/web
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web
      - id: deployment
        uses: actions/deploy-pages@v4
