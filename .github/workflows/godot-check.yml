name: Godot project validation

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.4 stable
        run: |
          wget -q https://github.com/godotengine/godot-builds/releases/download/4.4-stable/Godot_v4.4-stable_linux.x86_64.zip
          unzip -q Godot_v4.4-stable_linux.x86_64.zip
          chmod +x Godot_v4.4-stable_linux.x86_64
      - name: Import project
        run: ./Godot_v4.4-stable_linux.x86_64 --headless --path . --editor --import --quit
      - name: Parse project and scripts
        run: ./Godot_v4.4-stable_linux.x86_64 --headless --path . --editor --quit-after 60
